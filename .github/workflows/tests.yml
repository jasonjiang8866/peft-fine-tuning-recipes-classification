name: Benchmark regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependency-free regressions (site packages disabled)
        run: python -S -m unittest discover -s tests -v
      - name: Compile training entry points
        run: python -m py_compile benchmark_muon.py training.py runpod/validate.py
      - name: Validate RunPod shell scripts
        run: bash -n runpod/bootstrap.sh runpod/run.sh runpod/container-start.sh

  optimizer-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CPU PyTorch for native Muon scheduler checks
        run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Real optimizer and scheduler regression
        run: python -m unittest discover -s tests -p test_optimizer_pair_cpu.py -v

  trainer-cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      WANDB_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CPU Trainer stack (same direct pins as RunPod)
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 accelerate==1.11.0 peft==0.17.1 numpy==2.2.6 huggingface-hub==0.36.0 safetensors==0.6.2
          python -m pip check
      - name: Real Trainer and PEFT checkpoint resume, no downloads
        run: python -m unittest discover -s tests -p test_trainer_pair_cpu.py -v
